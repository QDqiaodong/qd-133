server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3359}/${MYSQL_DATABASE:qd_mashu_db}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:qd_mashu_user}
    password: ${MYSQL_PASSWORD:qd_mashu_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6432}
      password: ${REDIS_PASSWORD:qd_mashu_redis}
      timeout: 10000ms

  jackson:
    encoding: UTF-8
    default-property-inclusion: non_null

logging:
  level:
    com.qd.mashu: DEBUG
    org.hibernate.SQL: DEBUG